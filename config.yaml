# =============================================================
#  Battlezone Voice Commander - konfigurasjon
#  Endre verdier her uten å røre koden.
# =============================================================

gemini:
  # Modellvalg (juni 2026):
  #   gemini-3.5-flash      <- default: rask + billig, hører lyd godt. Anbefalt.
  #   gemini-3.1-pro        <- bytt hit KUN hvis Flash misforstår deg ofte
  #   gemini-3.1-flash-lite <- billigst/raskest, men svakere på tale-forståelse
  brain_model: "gemini-3.5-flash"            # hører lyden din og lager handlingsplanen
  # TTS: gemini-3.1-flash-tts-preview er Googles nåværende tale-modell (juni 2026).
  tts_model:   "gemini-3.1-flash-tts-preview"  # stemmen som svarer deg
  tts_voice:   "Charon"              # prøv: Charon, Kore, Puck, Fenrir, Aoede
  spoken_language: "norsk"           # språket DU snakker (brukes som hint til modellen)

audio:
  sample_rate: 16000   # mic-opptak (16 kHz holder for tale)
  channels: 1

controls:
  # Hold denne tasten inne mens du snakker (push-to-talk).
  push_to_talk: "caps lock"
  # Trykk denne for å avslutte programmet.
  quit_key: "esc"

# -------------------------------------------------------------
#  SIKKERHET: start ALLTID i tørrkjøring.
#  true  = skriver bare ut hvilke taster den VILLE trykket (trygt)
#  false = sender ekte tastetrykk til spillet
# -------------------------------------------------------------
dry_run: true

# Sekunder før en enhet regnes som ferdigbygd (timer-basert).
# VERIFISER disse i spillet - de er anslag.
build_times:
  scout: 12
  tank: 20
  thunderbolt: 16
  default: 15

# -------------------------------------------------------------
#  TASTESEKVENSER for Battlezone 98 sitt command interface.
#
#  Slik fungerer bygging i BZ98 Redux (NSDF-standardoppsett):
#    Talltast 5  = åpner RECYCLER sin byggmeny
#    Talltast 6  = åpner FACTORY sin byggmeny
#    Talltast 7  = åpner CONSTRUCTOR (bygninger)
#  Når menyen er åpen velger du enheten med tallet for PLASSEN den
#  har i lista (kostnaden vises i blått til høyre). Lette enheter
#  (scout/scavenger) bygges fra Recycler; tunge (tank/bomber) fra Factory.
#
#  build.<enhet> = [ <produsent-tast>, <plass-i-meny> ]
#  >>> Produsent-tasten (5/6) er BZ98-standard. Det ANDRE tallet er
#      et kvalifisert ANSLAG for plassen i menyen - les av din egen
#      meny in-game og rett tallet. dry_run: true gjør dette helt trygt:
#      du ser rekkefølgen i terminalen før noe sendes til spillet. <<<
# -------------------------------------------------------------
keymap:
  # Velg din egen enhet (så "follow me" gjelder deg)
  select_self: ["f1"]

  # Bygging - produsent-tast er sikker, plass-i-meny må verifiseres in-game:
  build:
    scout:       ["5", "2"]   # Recycler -> anslått plass 2 (slot 1 er ofte Scavenger)
    tank:        ["6", "1"]   # Factory  -> anslått plass 1
    thunderbolt: ["6", "2"]   # Factory  -> anslått plass 2 (bomber)

  # Standardkommandoer (BZ98-defaults):
  follow_me: ["1"]
  hold:      ["4"]
  attack:    ["3"]   # verifiser
  stop:      ["4"]   # "hold" fungerer som stopp

  # Velg nylig bygde enheter før "follow me". CTRL+1 = alle offensive
  # enheter i BZ98, som inkluderer nybygde kampenheter. Skrives som
  # chord med "+". Bytt til ["f1"] e.l. hvis du heller vil styre deg selv.
  select_last_built: ["ctrl+1"]
