# =============================================================
#  Battlezone Voice Commander - konfigurasjon
#  Endre verdier her uten å røre koden.
# =============================================================

gemini:
  # Modellvalg (juni 2026):
  #   gemini-3.5-flash      <- default: rask + billig, hører lyd godt. Anbefalt.
  #   gemini-3.1-pro        <- bytt hit KUN hvis Flash misforstår deg ofte
  #   gemini-3.1-flash-lite <- billigst/raskest, men svakere på tale-forståelse
  brain_model: "gemini-3.5-flash"            # hører lyden din og lager handlingsplanen
  # TTS: gemini-3.1-flash-tts-preview er Googles nåværende tale-modell (juni 2026).
  tts_model:   "gemini-3.1-flash-tts-preview"  # stemmen som svarer deg
  tts_voice:   "Charon"              # prøv: Charon, Kore, Puck, Fenrir, Aoede
  spoken_language: "norsk"           # språket DU snakker (brukes som hint til modellen)

audio:
  sample_rate: 16000   # mic-opptak (16 kHz holder for tale)
  channels: 1

controls:
  # Hold denne tasten inne mens du snakker (push-to-talk).
  push_to_talk: "left shift"
  # Trykk denne for å avslutte programmet.
  quit_key: "esc"

# -------------------------------------------------------------
#  SIKKERHET: start ALLTID i tørrkjøring.
#  true  = skriver bare ut hvilke taster den VILLE trykket (trygt)
#  false = sender ekte tastetrykk til spillet
# -------------------------------------------------------------
dry_run: false

# Sekunder før en enhet regnes som ferdigbygd (timer-basert).
# Hver enhet har en FAST byggetid i BZ98. Verdiene under er foreløpige
# ANSLAG - bytt dem ut med de eksakte tidene du leser av in-game.
build_times:
  # Recycler-enheter:
  scavenger: 5       # bekreftet
  turret: 6          # anslag
  fighter: 5         # anslag (CCA: Flanker)
  scout: 5           # alias for fighter
  # Factory-enheter:
  tank: 10           # bekreftet (CCA: Czar)
  light_tank: 7      # bekreftet (CCA: Stoli)
  tug: 6             # anslag (CCA: Tractor)
  howitzer: 15       # bekreftet (CCA: Cannoneer)
  minelayer: 7       # anslag (CCA: Molotov)
  rocket_tank: 10    # bekreftet (CCA: Tusker)
  apc: 8             # anslag
  bomber: 20         # bekreftet (CCA: Grendel)
  thunderbolt: 20    # alias for bomber
  walker: 15         # bekreftet (CCA: Golem)
  # Bygninger (Constructor bygger på få sek - anslag):
  factory: 8         # anslag (Unit Factory / MUF)
  armory: 8          # anslag (SLF)
  constructor: 8     # anslag (Erector)
  power_generator: 4 # anslag
  gun_tower: 4       # anslag
  comm_tower: 4      # anslag
  barracks: 4        # anslag
  silo: 4            # anslag
  supply_depot: 4    # anslag
  hangar: 4          # anslag
  default: 10

# -------------------------------------------------------------
#  TASTESEKVENSER for Battlezone 98 sitt command interface.
#
#  Slik virker BZ98: du VELGER enheter (talltaster / Ctrl+grupper),
#  så GIR du en ordre (talltast, ev. åpnet med Tab først). Bygging
#  skjer ved å åpne en produsents meny (5=Recycler, 6=Factory) og
#  velge enheten med tallet for PLASSEN den har i lista.
#
#  ALT styres herfra - legg til/endre kommandoer uten å røre koden.
#  Taller merket ANSLAG må verifiseres in-game (dry_run gjør det trygt:
#  du ser hele sekvensen i terminalen før noe sendes til spillet).
#  Bekreftede BZ98-defaults: follow=1, hold=4. Chord skrives med "+".
# -------------------------------------------------------------
keymap:
  # Må ordremenyen åpnes før du trykker ordretallet? BZ98 bruker Tab i
  # noen oppsett. La stå tom ("") hvis ordretallet virker direkte.
  command_menu_key: ""        # sett til "tab" hvis ordrene ikke virker uten

  # --- HVEM ordren gjelder (velges FØR kommandoen) -----------------
  # Brukes av "target" i ordrene. Ctrl+N = enhetsgrupper i BZ98.
  select:
    self:          ["f1"]      # din egen enhet
    all_offensive: ["ctrl+1"]  # alle angreps-enheter (bekreftet)
    all_defensive: ["ctrl+2"]  # alle forsvars-enheter (bekreftet)
    all_utility:   ["ctrl+3"]  # scavengers/constructors (bekreftet)
    scavengers:    ["ctrl+3"]  # samme gruppe som utility
    last_built:    ["ctrl+1"]  # nybygde kampenheter havner her

  # --- BYGGING ----------------------------------------------------
  # Kilde: strategywiki.org/wiki/Battlezone_(Activision)/CCA_units
  # NSDF og CCA har IDENTISKE menyer (kun andre navn/modeller).
  # [ <produsent/velg-tast>, <plass> (+ ev. flere for undermeny) ]
  # Produsent-tastene 5/6 er bekreftet; 7/8 (Armory/Constructor) er
  # standard utvalgstaster - verifiser in-game med dry_run.
  build:
    # --- Recycler (trykk 5) ---
    scavenger:   ["5", "1"]
    repair:      ["5", "2"]   # service/repair
    ammo:        ["5", "3"]   # service/ammo
    turret:      ["5", "4"]   # CCA: Pak
    fighter:     ["5", "5"]   # CCA: Flanker
    scout:       ["5", "5"]   # alias for fighter
    factory:     ["5", "6"]   # bygning: Unit Factory (MUF)
    armory:      ["5", "7"]   # bygning: SLF
    constructor: ["5", "8"]   # bygning: Erector

    # --- Unit Factory (trykk 6) ---
    tank:        ["6", "1"]   # CCA: Czar
    light_tank:  ["6", "2"]   # CCA: Stoli
    tug:         ["6", "3"]   # CCA: Tractor
    howitzer:    ["6", "4"]   # CCA: Cannoneer
    minelayer:   ["6", "5"]   # CCA: Molotov
    rocket_tank: ["6", "6"]   # CCA: Tusker
    apc:         ["6", "7"]
    bomber:      ["6", "8"]   # CCA: Grendel
    thunderbolt: ["6", "8"]   # alias for bomber
    walker:      ["6", "9"]   # CCA: Golem

    # --- Constructor (trykk 8) -> sikt + Mellomrom for plassering ---
    # NB: bot trykker bare produsent+slot; DU må sikte og trykke
    # SPACE for å faktisk plassere bygningen (1+2 er Follow/Go to nav).
    power_generator: ["8", "3"]
    gun_tower:       ["8", "4"]
    comm_tower:      ["8", "5"]
    barracks:        ["8", "6"]
    silo:            ["8", "7"]
    supply_depot:    ["8", "8"]
    hangar:          ["8", "9"]

  # --- PRODUKSJON fra Armory (trykk 7) ----------------------------
  # Direkte slots 1-4; våpen ligger i UNDERMENYER (3-tasts sekvens).
  produce:
    # Direkte:
    armory_repair: ["7", "1"]
    armory_ammo:   ["7", "2"]
    nav_beacon:    ["7", "3"]   # Armory flinger nav (koster 1 scrap)
    day_wrecker:   ["7", "4"]   # kraftig spesialvåpen
    # Cannons (undermeny 6):
    minigun:       ["7", "6", "1"]
    at_stabber:    ["7", "6", "2"]
    sp_stabber:    ["7", "6", "3"]
    mag_cannon:    ["7", "6", "4"]
    flash_cannon:  ["7", "6", "5"]
    # Rockets (undermeny 7):
    shadow_missile:       ["7", "7", "1"]
    thermal_hornet:       ["7", "7", "2"]
    comet_cruise_missile: ["7", "7", "3"]
    tag_cannon:           ["7", "7", "4"]
    sandbag_missile:      ["7", "7", "5"]
    rocket_bomb:          ["7", "7", "6"]
    # Mortars (undermeny 8):
    mortar:        ["7", "8", "1"]
    mdm:           ["7", "8", "2"]
    pop_gun:       ["7", "8", "3"]
    splinter:      ["7", "8", "4"]
    # Special (undermeny 9):
    solar_flare:         ["7", "9", "1"]
    m_curtain:           ["7", "9", "2"]
    mits:                ["7", "9", "3"]
    proximity_mine:      ["7", "9", "4"]
    thumper:             ["7", "9", "5"]
    red_field_generator: ["7", "9", "6"]
    phantom_vir:         ["7", "9", "7"]
    site_camera:         ["7", "9", "8"]

  # --- ORDRE til valgte enheter (gis ETTER select) -----------------
  # VERIFISERT fra enhetens ordremeny. Menyen vises når enheter er
  # valgt - ingen Tab nødvendig (Tab = Cancel der).
  commands:
    follow:       ["1"]   # Follow Me - følger deg, rykker fram mot fiender
    go:           ["2"]   # Go to Nav
    attack:       ["3", "1"]  # Attack: 3 åpner liste over nærmeste fiender,
                              # 1 = velg den nærmeste (øverst). Endre 2. tall
                              # for å treffe lenger ned i lista.
    pickup:       ["4"]   # Pick Me Up (grået ut når ikke relevant)
    repair:       ["5"]   # Get Repair (grået ut)
    reload:       ["6"]   # Get Reload (grået ut)
    hunt:         ["7"]   # Hunt - søk opp fiender
    follow_close: ["8"]   # Follow Close
    defend:       ["9"]   # Defend - holder posisjon
    hold:         ["9"]   # BZ98 har ingen egen "hold"; Defend holder
    stop:         ["9"]   # samme
    recycle:      ["0"]   # Recycle - send enhet til gjenvinning
    scavenge:     ["2"]   # scavengers samler ved å dra til nav (Go to Nav)

  # --- NAV-BEACON --------------------------------------------------
  # Plasser en navigasjons-beacon der du ser.
  nav_beacon: ["n"]   # ANSLAG - verifiser tasten for nav beacon
